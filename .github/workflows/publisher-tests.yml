name: publisher テスト

on:
  pull_request:
    paths: ["publisher/**", ".github/workflows/publish*.yml"]
  push:
    branches: [main]
    paths: ["publisher/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - run: pip install -r publisher/requirements.txt oauthlib
      - run: python -m unittest discover -s publisher/tests -t . -v
