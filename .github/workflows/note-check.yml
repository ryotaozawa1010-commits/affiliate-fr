name: note・Substack 入館証チェック

on:
  schedule:
    # 毎日 17:47 UTC（パリ 18:47/19:47）。平日の引け後版より前に切れていないか確かめる
    # （毎時 0 分ちょうどは GitHub が混み合って遅延・欠落しやすいのでずらしている）
    - cron: "47 17 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r publisher/requirements.txt
      - name: note と Substack にログインできるか確認（記事は作らない）
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
          SUBSTACK_COOKIE: ${{ secrets.SUBSTACK_COOKIE }}
          SUBSTACK_URL: ${{ vars.SUBSTACK_URL }}
        run: python -m publisher.note_check
